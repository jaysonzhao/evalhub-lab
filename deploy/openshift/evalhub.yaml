apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: evalhub-lab
spec:
  replicas: 1
  tenancy: single
  database:
    type: postgresql
    secret: evalhub-db-credentials
    maxOpenConns: 20
    maxIdleConns: 5
  env:
    - name: MLFLOW_TRACKING_URI
      value: https://rh-ai.apps.cluster-v4vsc.v4vsc.sandbox287.opentlc.com/mlflow
