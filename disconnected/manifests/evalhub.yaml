apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  tenancy: single
  database:
    type: postgresql
    secret: evalhub-db-credentials
    maxOpenConns: 20
    maxIdleConns: 5
  env:
    - name: MLFLOW_TRACKING_URI
      value: ${MLFLOW_TRACKING_URI}
