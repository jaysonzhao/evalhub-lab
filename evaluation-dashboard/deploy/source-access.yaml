# Apply this file only after the evalhub-dashboard namespace and service
# account exist. It grants source reads, PipelineRun create/list, patch access
# to one fixed API-key Secret, and read access to the durable run ledger.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-dashboard-evalhub-reader
  namespace: evalhub-lab
rules:
  - apiGroups: ["trustyai.opendatahub.io"]
    resourceNames: ["evalhub"]
    resources: ["evalhubs"]
    verbs: ["get"]
  - apiGroups: ["trustyai.opendatahub.io"]
    resourceNames: ["evalhub"]
    resources: ["evalhubs/proxy"]
    verbs: ["get", "create"]
  - apiGroups: ["trustyai.opendatahub.io"]
    resources: ["evaluations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-dashboard-evalhub-reader
  namespace: evalhub-lab
subjects:
  - kind: ServiceAccount
    name: metrics-dashboard
    namespace: evalhub-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-dashboard-evalhub-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-dashboard-mlflow-reader
  namespace: evalhub-lab
subjects:
  - kind: ServiceAccount
    name: metrics-dashboard
    namespace: evalhub-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-dashboard-pipeline-trigger
  namespace: evalhub-lab
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dashboard-maas-api-key"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["maas-eval-ledger"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-dashboard-pipeline-trigger
  namespace: evalhub-lab
subjects:
  - kind: ServiceAccount
    name: metrics-dashboard
    namespace: evalhub-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-dashboard-pipeline-trigger
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-maas-api-key
  namespace: evalhub-lab
  labels:
    app.kubernetes.io/name: maas-evaluation
    app.kubernetes.io/managed-by: evalhub-dashboard
type: Opaque
data: {}
